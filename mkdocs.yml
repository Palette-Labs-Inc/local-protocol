site_name: Local Protocol
site_dir: site
docs_dir: docs

nav:
  - Home: index.md
  - Philosophy: documentation/philosophy.md
  - Getting Started:
      - Picking Capabilities: getting-started/picking-capabilities.md
      - Add UCP Discovery: getting-started/ucp-setup.md
      - APIs:
          - REST: apis/rest.md
          - MCP: apis/mcp.md
          - A2A: apis/a2a.md
  - Capabilities:
      - Delivery:
          - Overview: capabilities/delivery/overview.md
          - Objects:
              - Ask: capabilities/delivery/ask.md
              - Bid: capabilities/delivery/bid.md
              - Delivery: capabilities/delivery/delivery.md
          - Types:
              - Location: capabilities/delivery/location.md
              - Coordinates: capabilities/delivery/coordinates.md
          - Events: capabilities/delivery/events.md
  - Payment:
      - Overview: payment/overview.md
      - EVM Auth/Capture Payments: payment/escrow.md

theme:
  name: material
  logo: assets/lp.svg
  favicon: assets/lp.svg
  font:
    text: Google Sans
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
    view: material/pencil-box-multiple
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left
  palette:
    - scheme: default
      primary: white
      accent: indigo
    - scheme: slate
      primary: black
      accent: indigo
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow

markdown_extensions:
  - meta
  - footnotes
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: .
      url_download: true
      dedent_subsections: true
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/custom.css
