[project]
name = "local-protocol"
version = "0.1.0"
description = "Local Protocol docs and schemas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Treat this as a docs/spec artifact, not a Python package.
only-include = [
  "docs",
  "schemas",
  "bindings",
  "mkdocs.yml",
  "README.md",
]
