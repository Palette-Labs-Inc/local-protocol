# yaml-language-server: $schema=https://app.stainless.com/config.schema.json
#
# Stainless SDK generation config for Local Protocol.
#
# This is the sole SDK generator for the project. It reads the OpenAPI spec
# (path configured in workspace.json) and produces typed client libraries for
# Python, PHP, and TypeScript.
#
# History: the repo previously used OpenAPI Generator, then Speakeasy. Both were
# removed in favour of Stainless (see DECISIONS.md 2026-02-09). The OpenAPI spec
# no longer carries any generator-specific annotations (x-speakeasy-*, etc.).
#
# Usage:
#   stl preview              # generate all targets
#   stl preview --target py  # generate one target
#   stl lint                 # validate spec + config
#   just build-sdks          # lint + generate (recommended entry point)

# The main edition for the config, see the [docs] for more information.
#
# [docs]: https://www.stainless.com/docs/reference/editions
edition: 2026-01-30

organization:
  # Name of your organization or company, used to determine the name of the client
  # and headings.
  name: local-protocol
  github_org: Palette-Labs-Inc
  # Link to your API documentation.
  docs: https://localprotocol.xyz
  # Contact email for bug reports, questions, and support requests.
  contact: ''

# `targets` define the output targets and their customization options, such as
# whether to emit the Node SDK and what its package name should be.
targets:
  typescript:
    # The edition for this target, see the [docs] for more information.
    #
    # [docs]: https://www.stainless.com/docs/reference/editions
    edition: typescript.2025-10-10
    package_name: local-protocol
    production_repo: Palette-Labs-Inc/local-protocol-typescript
    publish:
      npm: false
  php:
    edition: php.2025-10-08
    package_name: local-protocol
    production_repo: Palette-Labs-Inc/local-protocol-php
    composer_package_name: local-protocol/local-protocol
  python:
    edition: python.2025-11-20
    package_name: local_protocol
    production_repo: Palette-Labs-Inc/local-protocol-python
    publish:
      pypi: false

# `environments` are a map of the name of the environment (e.g. "sandbox",
# "production") to the corresponding url to use.
environments:
  local: http://localhost:8000

# `resources` define the structure and organization for your API, such as how
# methods and models are grouped together and accessed. See the [configuration
# guide] for more information.
#
# [configuration guide]: https://www.stainless.com/docs/guides/configure#resources
resources:
  well_known:
    description: Discover server capabilities, standards, and endpoints.
    # Configure the methods defined in this resource. Each key in the object is the
    # name of the method and the value is either an endpoint (for example, `get /foo`)
    # or an object with more detail.
    #
    # [reference]: https://www.stainless.com/docs/reference/config#method
    methods:
      retrieve: get /.well-known/local-protocol

  healthz:
    description: Check whether the server is currently healthy.
    methods:
      check: get /healthz

  requests:
    description: Create and manage delivery requests.
    models:
      postal_address: '#/components/schemas/PostalAddress'
      location: '#/components/schemas/Location'
      coordinates: '#/components/schemas/Coordinates'
      delivery_request: '#/components/schemas/DeliveryRequest'
    methods:
      create: post /requests
      list: get /requests
      retrieve: get /requests/{request_id}
    # Subresources define resources that are nested within another for more powerful
    # logical groupings, e.g. `cards.payments`.
    subresources:
      quotes:
        description: Create and read delivery quotes for a request.
        # Configure the models--named types--defined in the resource. Each key in the
        # object is the name of the model and the value is either the name of a schema in
        # `#/components/schemas` or an object with more detail.
        #
        # [reference]: https://www.stainless.com/docs/reference/config#model
        models:
          delivery_quote: '#/components/schemas/DeliveryQuote'
        methods:
          create: post /requests/{request_id}/quotes
          list: get /requests/{request_id}/quotes
          retrieve: get /requests/{request_id}/quotes/{quote_id}

  deliveries:
    description: Accept quotes and manage delivery lifecycle state.
    models:
      delivery: '#/components/schemas/Delivery'
    methods:
      create: post /deliveries
      list: get /deliveries
      retrieve: get /deliveries/{delivery_id}
      update_event: patch /deliveries/{delivery_id}/event

  merchants:
    description: Read merchant profile and denormalized catalog data.
    models:
      availability: '#/components/schemas/Availability'
      modifier_option: '#/components/schemas/ModifierOption'
      modifier_group: '#/components/schemas/ModifierGroup'
      catalog_category: '#/components/schemas/CatalogCategory'
    methods:
      retrieve: get /merchants/{merchant_id}

  orders:
    description: Create and retrieve orders and order-level requests.
    models:
      order: '#/components/schemas/Order'
    methods:
      create: post /orders
      retrieve: get /orders/{order_id}
    subresources:
      requests:
        description: Create order requests that can be quoted.
        methods:
          create: post /orders/requests
        subresources:
          quotes:
            description: List and retrieve order request quotes.
            models:
              order_quote: '#/components/schemas/OrderQuote'
            methods:
              list: get /orders/requests/{order_request_id}/quotes
              retrieve: get /orders/requests/{order_request_id}/quotes/{order_quote_id}

  event_vocabularies:
    description: Retrieve event vocabulary definitions by name.
    methods:
      retrieve: get /event-vocabularies/{name}

  payment_instruments:
    description: Register payment instruments and related payment models.
    models:
      evm_currency: '#/components/schemas/EvmCurrency'
      evm_amount: '#/components/schemas/EvmAmount'
      amount: '#/components/schemas/Amount'
      evm_auth_capture_escrow_instrument: '#/components/schemas/EvmAuthCaptureEscrowInstrument'
      evm_auth_capture_escrow_instrument_details: '#/components/schemas/EvmAuthCaptureEscrowInstrumentDetails'
      payment_instrument: '#/components/schemas/PaymentInstrument'
      selected_payment_instrument_selection_state: '#/components/schemas/SelectedPaymentInstrumentSelectionState'
      selected_payment_instrument: '#/components/schemas/SelectedPaymentInstrument'
      payment: '#/components/schemas/Payment'
    methods:
      register: post /payment-instruments

settings:
  # All generated integration tests that hit the prism mock http server are marked
  # as skipped. Removing this setting or setting it to false enables tests, but
  # doing so may result in test failures due to bugs in the test server.
  #
  # [prism mock http server]: https://stoplight.io/open-source/prism
  disable_mock_tests: true
  license: Apache-2.0

# `client_settings` define settings for the API client, such as extra constructor
# arguments (used for authentication), retry behavior, idempotency, etc.
client_settings:
  opts:
    api_key:
      type: string
      read_env: LOCAL_PROTOCOL_API_KEY
      nullable: false
      auth:
        security_scheme: bearerAuth

security_schemes:
  bearerAuth:
    type: http
    scheme: bearer

security:
  - bearerAuth: []

# `readme` is used to configure the code snippets that will be rendered in the
# README.md of various SDKs. In particular, you can change the `headline`
# snippet's endpoint and the arguments to call it with.
readme:
  example_requests:
    default:
      type: request
      endpoint: get /.well-known/local-protocol
      params: {}
    headline:
      type: request
      endpoint: post /requests
      params:
        id: req_demo_123
        nonce: nonce_demo_123
        pickup_location:
          coordinates:
            latitude: 37.7751
            longitude: -122.4193
        dropoff_location:
          coordinates:
            latitude: 37.7875
            longitude: -122.4073
        pickup_time: "2026-02-10T17:00:00Z"
        dropoff_time: "2026-02-10T17:30:00Z"
