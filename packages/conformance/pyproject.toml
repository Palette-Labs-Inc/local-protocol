[project]
name = "local-protocol-conformance"
version = "0.1.0"
description = "Conformance tests for Local Protocol server implementations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Local Protocol Team" }
]
dependencies = [
    "absl-py>=1.0.0",
    "httpx>=0.26.0",
    "pydantic>=2.0.0",
    "local-protocol-sdk",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "ruff>=0.14.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
local-protocol-sdk = { path = "../python-sdk/", editable = true }

[tool.ruff]
line-length = 80
indent-width = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "N", "UP", "D", "PTH"]
ignore = ["D203", "D213"]
