openapi: "3.1.0"
info:
  title: "Local Protocol"
  description: "Local Protocol delivery API. Covers service discovery, delivery requests, quotes, and deliveries."
  version: "0.1.0"
servers:
  - url: "http://localhost:8000"
    description: "Local development server"
tags:
  - name: "discovery"
    description: "Service discovery and health"
  - name: "requests"
    description: "Delivery request operations"
  - name: "quotes"
    description: "Delivery quote operations"
  - name: "deliveries"
    description: "Delivery lifecycle operations"
  - name: "merchants"
    description: "Merchant and catalog operations"
  - name: "orders"
    description: "Order lifecycle operations"
  - name: "events"
    description: "Event vocabulary operations"
  - name: "payments"
    description: "Payment instrument operations"
paths:
  "/.well-known/local-protocol":
    get:
      tags:
        - "discovery"
      summary: "Service discovery"
      description: "Returns server capabilities, supported standards, and endpoint paths."
      operationId: "getDiscovery"
      responses:
        "200":
          description: "Discovery metadata."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/DiscoveryResponse"}
        "500":
          description: "Internal server error."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/healthz":
    get:
      tags:
        - "discovery"
      summary: "Health check"
      description: "Returns server health status."
      operationId: "getHealth"
      responses:
        "200":
          description: "Server is healthy."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/HealthResponse"}
        "503":
          description: "Service unavailable."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/requests":
    post:
      tags:
        - "requests"
      summary: "Create delivery request"
      description: "Submit a new delivery request. The `nonce` field provides idempotency."
      operationId: "createRequest"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/DeliveryRequest"}
      responses:
        "201":
          description: "Request created."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/DeliveryRequest"}
        "400":
          description: "Invalid nonce."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "409":
          description: "Duplicate nonce or request ID."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "422":
          description: "Validation errors."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ValidationErrorResponse"}
    get:
      tags:
        - "requests"
      summary: "List delivery requests"
      description: "Returns all delivery requests."
      operationId: "listRequests"
      responses:
        "200":
          description: "List of requests."
          content:
            "application/json":
              schema:
                type: "array"
                items: {"$ref": "#/components/schemas/DeliveryRequest"}
        "500":
          description: "Internal server error."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/requests/{request_id}":
    get:
      tags:
        - "requests"
      summary: "Get delivery request"
      description: "Returns a single delivery request by ID."
      operationId: "getRequest"
      parameters:
        - {"$ref": "#/components/parameters/RequestId"}
      responses:
        "200":
          description: "The request."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/DeliveryRequest"}
        "404":
          description: "Request not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/requests/{request_id}/quotes":
    post:
      tags:
        - "quotes"
      summary: "Create quote"
      description: "Submit a quote for a delivery request. The `nonce` field provides idempotency."
      operationId: "createQuote"
      parameters:
        - {"$ref": "#/components/parameters/RequestId"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/DeliveryQuote"}
      responses:
        "201":
          description: "Quote created."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/DeliveryQuote"}
        "400":
          description: "Invalid nonce."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "404":
          description: "Request not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "409":
          description: "Duplicate nonce or quote ID."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "422":
          description: "Validation errors."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ValidationErrorResponse"}
    get:
      tags:
        - "quotes"
      summary: "List quotes for request"
      description: "Returns all quotes for a delivery request."
      operationId: "listQuotes"
      parameters:
        - {"$ref": "#/components/parameters/RequestId"}
      responses:
        "200":
          description: "List of quotes."
          content:
            "application/json":
              schema:
                type: "array"
                items: {"$ref": "#/components/schemas/DeliveryQuote"}
        "404":
          description: "Request not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/requests/{request_id}/quotes/{quote_id}":
    get:
      tags:
        - "quotes"
      summary: "Get quote"
      description: "Returns a single quote by ID."
      operationId: "getQuote"
      parameters:
        - {"$ref": "#/components/parameters/RequestId"}
        - {"$ref": "#/components/parameters/QuoteId"}
      responses:
        "200":
          description: "The quote."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/DeliveryQuote"}
        "404":
          description: "Request or quote not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/deliveries":
    post:
      tags:
        - "deliveries"
      summary: "Create delivery"
      description: "Accept a quote and create a delivery. The `nonce` field provides idempotency."
      operationId: "createDelivery"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/CreateDeliveryRequest"}
      responses:
        "201":
          description: "Delivery created."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Delivery"}
        "400":
          description: "Invalid nonce or quote does not belong to request."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "404":
          description: "Request or quote not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "409":
          description: "Duplicate nonce or nonce reuse with different payload."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
    get:
      tags:
        - "deliveries"
      summary: "List deliveries"
      description: "Returns all deliveries."
      operationId: "listDeliveries"
      responses:
        "200":
          description: "List of deliveries."
          content:
            "application/json":
              schema:
                type: "array"
                items: {"$ref": "#/components/schemas/Delivery"}
        "500":
          description: "Internal server error."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/deliveries/{delivery_id}":
    get:
      tags:
        - "deliveries"
      summary: "Get delivery"
      description: "Returns a single delivery by ID."
      operationId: "getDelivery"
      parameters:
        - {"$ref": "#/components/parameters/DeliveryId"}
      responses:
        "200":
          description: "The delivery."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Delivery"}
        "404":
          description: "Delivery not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/deliveries/{delivery_id}/event":
    patch:
      tags:
        - "deliveries"
      summary: "Update delivery event"
      description: "Transition a delivery to a new event state. If a webhook URL was registered, the server pushes an event notification in the background."
      operationId: "updateDeliveryEvent"
      parameters:
        - {"$ref": "#/components/parameters/DeliveryId"}
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/UpdateEventRequest"}
      responses:
        "200":
          description: "Delivery event updated."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Delivery"}
        "404":
          description: "Delivery not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/merchants/{merchant_id}":
    get:
      tags:
        - "merchants"
      summary: "Get merchant"
      description: "Returns a merchant with its full denormalized catalog tree."
      operationId: "getMerchant"
      parameters:
        - {"$ref": "#/components/parameters/MerchantId"}
      responses:
        "200":
          description: "The merchant."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Merchant"}
        "404":
          description: "Merchant not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/orders/requests":
    post:
      tags:
        - "orders"
      summary: "Create order request"
      description: "Submit a new order request with a cart. The `nonce` field provides idempotency."
      operationId: "createOrderRequest"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/Cart"}
      responses:
        "201":
          description: "Order request created."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/OrderRequest"}
        "400":
          description: "Invalid request."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "409":
          description: "Duplicate nonce or request ID."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "422":
          description: "Validation errors."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ValidationErrorResponse"}
  "/orders/requests/{order_request_id}/quotes":
    get:
      tags:
        - "orders"
      summary: "List order quotes"
      description: "Returns all quotes for an order request."
      operationId: "listOrderQuotes"
      parameters:
        - {"$ref": "#/components/parameters/OrderRequestId"}
      responses:
        "200":
          description: "List of order quotes."
          content:
            "application/json":
              schema:
                type: "array"
                items: {"$ref": "#/components/schemas/OrderQuote"}
        "404":
          description: "Order request not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/orders/requests/{order_request_id}/quotes/{order_quote_id}":
    get:
      tags:
        - "orders"
      summary: "Get order quote"
      description: "Returns a single order quote by ID."
      operationId: "getOrderQuote"
      parameters:
        - {"$ref": "#/components/parameters/OrderRequestId"}
        - {"$ref": "#/components/parameters/OrderQuoteId"}
      responses:
        "200":
          description: "The order quote."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/OrderQuote"}
        "404":
          description: "Order request or quote not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/orders":
    post:
      tags:
        - "orders"
      summary: "Create order"
      description: "Accept a quote and create an order. The `nonce` field provides idempotency."
      operationId: "createOrder"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/CreateOrderRequest"}
      responses:
        "201":
          description: "Order created."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Order"}
        "400":
          description: "Invalid nonce or quote does not belong to request."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "404":
          description: "Order request or quote not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "409":
          description: "Duplicate nonce."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/orders/{order_id}":
    get:
      tags:
        - "orders"
      summary: "Get order"
      description: "Returns a single order by ID."
      operationId: "getOrder"
      parameters:
        - {"$ref": "#/components/parameters/OrderId"}
      responses:
        "200":
          description: "The order."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/Order"}
        "404":
          description: "Order not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/event-vocabularies/{name}":
    get:
      tags:
        - "events"
      summary: "Get event vocabulary"
      description: "Returns a delivery event vocabulary by name."
      operationId: "getEventVocabulary"
      parameters:
        - {"$ref": "#/components/parameters/EventVocabularyName"}
      responses:
        "200":
          description: "The event vocabulary."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/DeliveryEventVocabulary"}
        "404":
          description: "Event vocabulary not found."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
  "/payment-instruments":
    post:
      tags:
        - "payments"
      summary: "Register payment instrument"
      description: "Register a payment instrument for use in order creation."
      operationId: "createPaymentInstrument"
      requestBody:
        required: true
        content:
          "application/json":
            schema: {"$ref": "#/components/schemas/EvmAuthCaptureEscrowInstrument"}
      responses:
        "201":
          description: "Payment instrument registered."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/EvmAuthCaptureEscrowInstrument"}
        "400":
          description: "Invalid instrument data."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ErrorResponse"}
        "422":
          description: "Validation errors."
          content:
            "application/json":
              schema: {"$ref": "#/components/schemas/ValidationErrorResponse"}
components:
  parameters:
    "RequestId":
      name: "request_id"
      in: "path"
      required: true
      description: "Delivery request identifier."
      schema:
        type: "string"
    "QuoteId":
      name: "quote_id"
      in: "path"
      required: true
      description: "Quote identifier."
      schema:
        type: "string"
    "DeliveryId":
      name: "delivery_id"
      in: "path"
      required: true
      description: "Delivery identifier."
      schema:
        type: "string"
    "MerchantId":
      name: "merchant_id"
      in: "path"
      required: true
      description: "Merchant identifier."
      schema:
        type: "string"
    "OrderRequestId":
      name: "order_request_id"
      in: "path"
      required: true
      description: "Order request identifier."
      schema:
        type: "string"
    "OrderQuoteId":
      name: "order_quote_id"
      in: "path"
      required: true
      description: "Order quote identifier."
      schema:
        type: "string"
    "OrderId":
      name: "order_id"
      in: "path"
      required: true
      description: "Order identifier."
      schema:
        type: "string"
    "EventVocabularyName":
      name: "name"
      in: "path"
      required: true
      description: "Event vocabulary name in reverse-domain notation (e.g., xyz.localprotocol.delivery.courier)."
      schema:
        type: "string"
  schemas:
    "Coordinates":
      type: "object"
      description: "Geographic coordinates."
      required:
        - "latitude"
        - "longitude"
      additionalProperties: false
      properties:
        "latitude":
          type: "number"
          minimum: -90
          maximum: 90
          description: "Latitude in decimal degrees."
        "longitude":
          type: "number"
          minimum: -180
          maximum: 180
          description: "Longitude in decimal degrees."
    "PostalAddress":
      type: "object"
      title: "Postal Address"
      properties:
        "extended_address":
          type: "string"
          description: "Address extension (apartment number, C/O, etc.)."
        "street_address":
          type: "string"
          description: "The street address."
        "address_locality":
          type: "string"
          description: "City or locality."
        "address_region":
          type: "string"
          description: "State, province, or region."
        "address_country":
          type: "string"
          description: "Country (ISO 3166-1 alpha-2 recommended)."
        "postal_code":
          type: "string"
          description: "Postal code."
        "first_name":
          type: "string"
          description: "Contact first name."
        "last_name":
          type: "string"
          description: "Contact last name."
        "phone_number":
          type: "string"
          description: "Contact phone number."
    "Location":
      type: "object"
      description: "A location specified by coordinates and/or postal address. At least one must be provided."
      additionalProperties: false
      properties:
        "coordinates": {"$ref": "#/components/schemas/Coordinates"}
        "postal_address": {"$ref": "#/components/schemas/PostalAddress"}
      anyOf:
        - required:
            - "coordinates"
        - required:
            - "postal_address"
    "DeliveryRequest":
      type: "object"
      description: "A delivery request."
      required:
        - "id"
        - "nonce"
        - "pickup_location"
        - "dropoff_location"
        - "pickup_time"
        - "dropoff_time"
      properties:
        "id":
          type: "string"
          description: "Unique request identifier."
        "nonce":
          type: "string"
          description: "Client-generated idempotency key."
        "pickup_location": {"$ref": "#/components/schemas/Location"}
        "dropoff_location": {"$ref": "#/components/schemas/Location"}
        "pickup_time":
          type: "string"
          format: "date-time"
          description: "Requested pickup time (RFC 3339)."
        "dropoff_time":
          type: "string"
          format: "date-time"
          description: "Requested dropoff time (RFC 3339)."
        "pickup_instructions":
          type: "string"
          description: "Pickup directions, access codes, or handling notes."
        "dropoff_instructions":
          type: "string"
          description: "Dropoff directions, access codes, or delivery notes."
      additionalProperties: false
    "DeliveryQuote":
      type: "object"
      description: "A delivery quote."
      required:
        - "id"
        - "nonce"
        - "price"
        - "currency"
        - "pickup_location"
        - "dropoff_location"
        - "pickup_estimate"
        - "dropoff_estimate"
        - "payment"
      properties:
        "id":
          type: "string"
          description: "Unique quote identifier."
        "nonce":
          type: "string"
          description: "Client-generated idempotency key."
        "price":
          type: "integer"
          minimum: 0
          description: "Price in minor currency units."
        "currency":
          type: "string"
          pattern: "^[A-Z]{3}$"
          description: "ISO 4217 currency code."
        "pickup_location": {"$ref": "#/components/schemas/Location"}
        "dropoff_location": {"$ref": "#/components/schemas/Location"}
        "pickup_estimate":
          type: "string"
          format: "date-time"
          description: "Estimated pickup time (RFC 3339)."
        "dropoff_estimate":
          type: "string"
          format: "date-time"
          description: "Estimated dropoff time (RFC 3339)."
        "expires_at":
          type: "string"
          format: "date-time"
          description: "Time when the quote expires (RFC 3339)."
        "payment": {"$ref": "#/components/schemas/Payment", "description": "Payment handlers available for accepting this quote."}
      additionalProperties: false
    "CreateDeliveryRequest":
      type: "object"
      description: "Body for creating a delivery from an accepted quote."
      required:
        - "request_id"
        - "quote_id"
        - "nonce"
      additionalProperties: false
      properties:
        "request_id":
          type: "string"
          description: "The delivery request to fulfill."
        "quote_id":
          type: "string"
          description: "The accepted quote."
        "nonce":
          type: "string"
          description: "Client-generated idempotency key."
        "webhook_url":
          type:
            - "string"
            - "null"
          description: "Optional URL to receive delivery event webhook notifications."
        "event_vocabulary":
          type: "string"
          description: "Event vocabulary standard to use."
          default: "xyz.localprotocol.delivery.courier@2026-01-30"
    "UpdateEventRequest":
      type: "object"
      description: "Body for updating a delivery event."
      required:
        - "event"
        - "event_description"
      additionalProperties: false
      properties:
        "event":
          type: "string"
          description: "Event identifier from the delivery's event vocabulary."
        "event_description":
          type: "string"
          description: "Human-readable event description."
    "Delivery":
      type: "object"
      description: "A delivery resource."
      required:
        - "id"
        - "request_id"
        - "quote_id"
        - "payment_instrument_id"
        - "event"
        - "event_description"
        - "event_vocabulary"
        - "created_at"
        - "updated_at"
      properties:
        "id":
          type: "string"
          description: "Unique delivery identifier."
        "request_id":
          type: "string"
          description: "Reference to the delivery request."
        "quote_id":
          type: "string"
          description: "Reference to the accepted quote."
        "payment_instrument_id":
          type: "string"
          description: "Reference to the payment instrument used to create this delivery."
        "event":
          type: "string"
          description: "Current event identifier."
        "event_description":
          type: "string"
          description: "Human-readable description of the current event."
        "event_vocabulary":
          type: "string"
          description: "Event vocabulary standard in use."
        "webhook_url":
          type:
            - "string"
            - "null"
          description: "Registered webhook URL, if any."
        "created_at":
          type: "string"
          format: "date-time"
          description: "Creation timestamp (RFC 3339)."
        "updated_at":
          type: "string"
          format: "date-time"
          description: "Last update timestamp (RFC 3339)."
      additionalProperties: false
    "DiscoveryResponse":
      type: "object"
      description: "Service discovery metadata."
      required:
        - "version"
        - "name"
        - "capabilities"
        - "endpoints"
      properties:
        "version":
          type: "string"
          description: "Protocol version."
        "name":
          type: "string"
          description: "Server name."
        "capabilities":
          type: "object"
          description: "Supported capabilities by domain."
          additionalProperties: true
        "endpoints":
          type: "object"
          description: "Endpoint path map."
          additionalProperties:
            type: "string"
      additionalProperties: false
    "HealthResponse":
      type: "object"
      description: "Health check response."
      required:
        - "status"
      properties:
        "status":
          type: "string"
          enum:
            - "ok"
      additionalProperties: false
    "ErrorResponse":
      type: "object"
      description: "Error response with a human-readable detail message."
      required:
        - "detail"
      properties:
        "detail":
          type: "string"
          description: "Error message."
    "ValidationErrorResponse":
      type: "object"
      description: "Validation error response with a list of field-level errors."
      required:
        - "detail"
      properties:
        "detail":
          type: "object"
          required:
            - "errors"
          properties:
            "errors":
              type: "array"
              items:
                type: "string"
              description: "List of validation error messages."
    "FiatCurrency":
      type: "object"
      description: "Fiat currency descriptor."
      required:
        - "symbol"
      additionalProperties: false
      properties:
        "symbol":
          type: "string"
          description: "ISO 4217 currency code (e.g., 'USD', 'EUR', 'JPY')."
          pattern: "^[A-Z0-9_]+$"
    "EvmCurrency":
      type: "object"
      description: "EVM token currency descriptor."
      required:
        - "chain_id"
        - "address"
        - "decimals"
      additionalProperties: false
      properties:
        "chain_id":
          type: "integer"
          minimum: 1
          description: "EVM chain id."
        "address":
          type: "string"
          pattern: "^0x[a-fA-F0-9]{40}$"
          description: "Token contract address."
        "decimals":
          type: "integer"
          minimum: 0
          maximum: 255
          description: "Decimal places for the token."
    "Amount":
      type: "object"
      description: "Amount with explicit currency. Value is always in minor units (e.g., cents for USD)."
      required:
        - "value"
        - "currency"
      additionalProperties: false
      properties:
        "value":
          type: "string"
          pattern: "^[0-9]+$"
          description: "Value in minor currency units as an integer string."
        "currency":
          description: "Currency descriptor (fiat or EVM token)."
          oneOf:
            - {"$ref": "#/components/schemas/FiatCurrency"}
            - {"$ref": "#/components/schemas/EvmCurrency"}
    "Media":
      type: "object"
      description: "Product media item (image, video, etc.)."
      required:
        - "type"
        - "url"
      properties:
        "type":
          type: "string"
          enum:
            - "image"
            - "video"
            - "model_3d"
          description: "Media type discriminator."
        "url":
          type: "string"
          format: "uri"
          description: "URL to the media resource."
        "alt_text":
          type: "string"
          description: "Accessibility text describing the media."
        "width":
          type: "integer"
          minimum: 1
          description: "Width in pixels."
        "height":
          type: "integer"
          minimum: 1
          description: "Height in pixels."
    "Interval":
      type: "object"
      description: "A single time interval for a day of the week or a specific date."
      required:
        - "from_hour"
        - "from_minute"
        - "to_hour"
        - "to_minute"
      additionalProperties: false
      properties:
        "day":
          type: "string"
          description: "Day of week (e.g., Monday, Tuesday)."
        "date":
          type: "string"
          format: "date"
          description: "Calendar date in YYYY-MM-DD."
        "from_hour":
          type: "integer"
          minimum: 0
          maximum: 23
          description: "Start hour (0-23)."
        "from_minute":
          type: "integer"
          minimum: 0
          maximum: 59
          description: "Start minute (0-59)."
        "to_hour":
          type: "integer"
          minimum: 0
          maximum: 23
          description: "End hour (0-23)."
        "to_minute":
          type: "integer"
          minimum: 0
          maximum: 59
          description: "End minute (0-59)."
      oneOf:
        - required:
            - "day"
        - required:
            - "date"
    "Availability":
      type: "object"
      description: "Availability schedule for a catalog, category, or item."
      required:
        - "intervals"
      additionalProperties: false
      properties:
        "timezone":
          type: "string"
          description: "IANA timezone. Defaults to merchant timezone when omitted."
        "intervals":
          type: "array"
          minItems: 1
          items: {"$ref": "#/components/schemas/Interval"}
          description: "Availability intervals (weekly or date-specific)."
    "ModifierItem":
      type: "object"
      description: "A purchasable modifier item within a modifier group."
      required:
        - "id"
        - "name"
        - "price"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Modifier item identifier."
        "name":
          type: "string"
          description: "Modifier item name."
        "description":
          type: "string"
          description: "Optional modifier item description."
        "price": {"$ref": "#/components/schemas/Amount", "description": "Price for this modifier item."}
        "metadata":
          type: "object"
          description: "Business-defined custom data."
          additionalProperties: true
    "ModifierOption":
      type: "object"
      description: "Selectable option within a modifier group."
      required:
        - "id"
        - "modifier_item"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Modifier option identifier."
        "modifier_item": {"$ref": "#/components/schemas/ModifierItem", "description": "Modifier item for this option."}
        "child_modifier_groups":
          type: "array"
          items: {"$ref": "#/components/schemas/ModifierGroup"}
          description: "Nested modifier groups required after selecting this option."
        "is_default":
          type: "boolean"
          description: "Whether this option is selected by default."
        "metadata":
          type: "object"
          description: "Business-defined custom data."
          additionalProperties: true
    "ModifierGroup":
      type: "object"
      description: "Group of modifier options with selection constraints."
      required:
        - "id"
        - "name"
        - "modifier_options"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Modifier group identifier."
        "name":
          type: "string"
          description: "Display name for the modifier group."
        "description":
          type: "string"
          description: "Optional modifier group description."
        "minimum_selections":
          type: "integer"
          minimum: 0
          description: "Minimum selections required."
        "maximum_selections":
          type: "integer"
          minimum: 0
          description: "Maximum selections allowed."
        "allow_quantities":
          type: "boolean"
          description: "Whether options can be selected with quantities > 1."
        "max_per_modifier":
          type: "integer"
          minimum: 0
          default: 1
          description: "Maximum quantity per modifier option."
        "modifier_options":
          type: "array"
          minItems: 1
          items: {"$ref": "#/components/schemas/ModifierOption"}
          description: "Ordered modifier options within this group."
        "type":
          type: "string"
          description: "Modifier group type classification."
        "metadata":
          type: "object"
          description: "Business-defined custom data."
          additionalProperties: true
    "CatalogItem":
      type: "object"
      description: "A menu item with embedded modifier groups."
      required:
        - "id"
        - "name"
        - "description"
        - "price"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Item identifier."
        "name":
          type: "string"
          description: "Item name."
        "description":
          type: "string"
          description: "Item description."
        "price": {"$ref": "#/components/schemas/Amount", "description": "Base price for the item."}
        "media":
          type: "array"
          items: {"$ref": "#/components/schemas/Media"}
          description: "Item media (images, videos, 3D models)."
        "modifier_groups":
          type: "array"
          items: {"$ref": "#/components/schemas/ModifierGroup"}
          description: "Modifier groups available for this item."
        "availability": {"$ref": "#/components/schemas/Availability", "description": "Item availability."}
        "metadata":
          type: "object"
          description: "Business-defined custom data."
          additionalProperties: true
    "CatalogCategory":
      type: "object"
      description: "A category grouping items in a catalog."
      required:
        - "id"
        - "name"
        - "items"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Category identifier."
        "name":
          type: "string"
          description: "Category display name."
        "description":
          type: "string"
          description: "Optional category description."
        "categories":
          type: "array"
          items: {"$ref": "#/components/schemas/CatalogCategory"}
          description: "Ordered child categories for nested category trees."
        "items":
          type: "array"
          items: {"$ref": "#/components/schemas/CatalogItem"}
          description: "Ordered items in this category."
        "availability": {"$ref": "#/components/schemas/Availability", "description": "Category availability."}
        "metadata":
          type: "object"
          description: "Business-defined custom data."
          additionalProperties: true
    "Catalog":
      type: "object"
      description: "A catalog containing embedded categories, items, availability, and fulfillment configuration."
      required:
        - "id"
        - "name"
        - "categories"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Catalog identifier."
        "name":
          type: "string"
          description: "Catalog name."
        "description":
          type: "string"
          description: "Catalog description."
        "categories":
          type: "array"
          items: {"$ref": "#/components/schemas/CatalogCategory"}
          description: "Ordered top-level categories."
        "items":
          type: "array"
          items: {"$ref": "#/components/schemas/CatalogItem"}
          description: "Items not assigned to a category."
        "availability": {"$ref": "#/components/schemas/Availability", "description": "Catalog-wide availability override."}
        "metadata":
          type: "object"
          description: "Business-defined custom data."
          additionalProperties: true
    "Merchant":
      type: "object"
      description: "Merchant catalog payload containing denormalized catalogs."
      required:
        - "id"
        - "name"
        - "timezone"
        - "catalogs"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Merchant identifier."
        "name":
          type: "string"
          description: "Merchant name."
        "timezone":
          type: "string"
          description: "IANA timezone for availability schedules."
        "last_updated":
          type: "string"
          format: "date-time"
          description: "RFC 3339 timestamp of the latest catalog update."
        "catalogs":
          type: "array"
          minItems: 1
          items: {"$ref": "#/components/schemas/Catalog"}
          description: "Catalogs available for the merchant."
        "metadata":
          type: "object"
          description: "Business-defined custom data."
          additionalProperties: true
    "CartItem":
      type: "object"
      description: "An item in a cart."
      required:
        - "id"
        - "quantity"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Item identifier."
        "quantity":
          type: "integer"
          minimum: 1
          description: "Quantity requested."
    "Cart":
      type: "object"
      description: "A shopping cart."
      required:
        - "id"
        - "intent_id"
        - "nonce"
        - "items"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Unique cart identifier."
        "intent_id":
          type: "string"
          description: "Shared intent identifier for tracing Request -> Quote -> Order."
        "nonce":
          type: "string"
          description: "Client-generated idempotency key."
        "items":
          type: "array"
          items: {"$ref": "#/components/schemas/CartItem"}
          description: "Items in the cart."
    "OrderRequest":
      type: "object"
      description: "An order request."
      required:
        - "id"
        - "intent_id"
        - "nonce"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Unique request identifier."
        "intent_id":
          type: "string"
          description: "Shared intent identifier for tracing Request -> Quote -> Order."
        "nonce":
          type: "string"
          description: "Client-generated idempotency key."
    "OrderQuote":
      type: "object"
      description: "An order quote."
      required:
        - "id"
        - "intent_id"
        - "nonce"
        - "price"
        - "ready_at"
        - "expires_at"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Unique quote identifier."
        "intent_id":
          type: "string"
          description: "Shared intent identifier for tracing Request -> Quote -> Order."
        "nonce":
          type: "string"
          description: "Client-generated idempotency key."
        "price":
          type: "integer"
          description: "Price in minor currency units."
        "ready_at":
          type: "string"
          format: "date-time"
          description: "Estimated readiness time (RFC 3339)."
        "expires_at":
          type: "string"
          format: "date-time"
          description: "Quote expiration time (RFC 3339)."
    "CreateOrderRequest":
      type: "object"
      description: "Body for creating an order from an accepted quote."
      required:
        - "order_request_id"
        - "order_quote_id"
        - "nonce"
        - "payment_instrument_id"
      additionalProperties: false
      properties:
        "order_request_id":
          type: "string"
          description: "The order request to fulfill."
        "order_quote_id":
          type: "string"
          description: "The accepted quote."
        "nonce":
          type: "string"
          description: "Client-generated idempotency key."
        "payment_instrument_id":
          type: "string"
          description: "Reference to the registered payment instrument."
    "Order":
      type: "object"
      description: "An order."
      required:
        - "id"
        - "intent_id"
        - "nonce"
        - "payment_instrument_id"
      additionalProperties: false
      properties:
        "id":
          type: "string"
          description: "Unique order identifier."
        "intent_id":
          type: "string"
          description: "Shared intent identifier for tracing Request -> Quote -> Order."
        "nonce":
          type: "string"
          description: "Client-generated idempotency key."
        "payment_instrument_id":
          type: "string"
          description: "Reference to the payment instrument used."
    "EvmToken":
      type: "object"
      description: "EVM token identifier used for auth/capture settlement."
      required:
        - "symbol"
        - "decimals"
      additionalProperties: false
      properties:
        "address":
          type: "string"
          pattern: "^0x[a-fA-F0-9]{40}$"
          description: "ERC-20 contract address. Omit for native gas tokens."
        "symbol":
          type: "string"
          description: "Token symbol (e.g., USDC)."
        "decimals":
          type: "integer"
          minimum: 0
          maximum: 255
          description: "Token decimals."
    "EvmAuthCaptureEscrowConfig":
      x-speakeasy-include: true
      type: "object"
      description: "Handler configuration for auth/capture escrow on EVM chains."
      required:
        - "chain_id"
        - "contract"
        - "operator"
        - "receiver"
        - "accepted_tokens"
      additionalProperties: true
      properties:
        "chain_id":
          type: "integer"
          minimum: 1
          description: "EVM chain id for the escrow contract."
        "contract":
          type: "string"
          pattern: "^0x[a-fA-F0-9]{40}$"
          description: "Escrow contract address."
        "operator":
          type: "string"
          pattern: "^0x[a-fA-F0-9]{40}$"
          description: "Operator address for state transitions."
        "receiver":
          type: "string"
          pattern: "^0x[a-fA-F0-9]{40}$"
          description: "Default receiver address for captures."
        "accepted_tokens":
          type: "array"
          minItems: 1
          items: {"$ref": "#/components/schemas/EvmToken"}
          description: "Tokens accepted on the escrow contract chain."
    "EvmAuthCaptureEscrowInstrument":
      description: "Payment instrument for auth/capture escrow on EVM chains."
      allOf:
        - {"$ref": "#/components/schemas/PaymentInstrument"}
        - type: "object"
          required:
            - "type"
            - "payment_info_hash"
            - "operator"
            - "payer"
            - "receiver"
            - "token"
            - "max_amount"
            - "preapproval_expires_at"
            - "authorization_expires_at"
            - "refund_expires_at"
            - "nonce"
            - "chain_id"
            - "contract"
            - "amount"
          properties:
            "type":
              type: "string"
              const: "evm_auth_capture_escrow"
            "payment_info_hash":
              type: "string"
              pattern: "^0x[a-fA-F0-9]{64}$"
              description: "Hash identifying the on-chain payment authorization."
            "operator":
              type: "string"
              pattern: "^0x[a-fA-F0-9]{40}$"
              description: "Operator address."
            "payer":
              type: "string"
              pattern: "^0x[a-fA-F0-9]{40}$"
              description: "Payer address."
            "chain_id":
              type: "integer"
              minimum: 1
              description: "EVM chain id."
            "contract":
              type: "string"
              pattern: "^0x[a-fA-F0-9]{40}$"
              description: "Escrow contract address."
            "receiver":
              type: "string"
              pattern: "^0x[a-fA-F0-9]{40}$"
              description: "Receiver address for captures."
            "token": {"$ref": "#/components/schemas/EvmToken"}
            "max_amount":
              allOf:
                - {"$ref": "#/components/schemas/Amount"}
                - properties:
                    "currency": {"$ref": "#/components/schemas/EvmCurrency"}
              description: "Maximum amount that can be authorized (atomic units). Currency chain_id MUST match the instrument chain_id; currency address and decimals MUST match token address and decimals."
            "preapproval_expires_at":
              type: "string"
              format: "date-time"
              description: "Pre-approval expiration (RFC 3339)."
            "authorization_expires_at":
              type: "string"
              format: "date-time"
              description: "Authorization expiration (RFC 3339)."
            "refund_expires_at":
              type: "string"
              format: "date-time"
              description: "Refund expiration (RFC 3339)."
            "nonce":
              type: "string"
              pattern: "^[0-9]+$"
              description: "Unique nonce for payment info hash computation."
            "amount":
              allOf:
                - {"$ref": "#/components/schemas/Amount"}
                - properties:
                    "currency": {"$ref": "#/components/schemas/EvmCurrency"}
              description: "Amount in atomic units. Currency chain_id MUST match the instrument chain_id; currency address and decimals MUST match token address and decimals."
          additionalProperties: true
    "PaymentCredential":
      type: "object"
      description: "Base definition for any payment credential."
      required:
        - "type"
      additionalProperties: true
      properties:
        "type":
          type: "string"
          description: "Credential type discriminator."
    "PaymentInstrument":
      type: "object"
      description: "Base definition for any payment instrument."
      required:
        - "id"
        - "handler_id"
        - "type"
      additionalProperties: true
      properties:
        "id":
          type: "string"
          description: "Unique instrument identifier."
        "handler_id":
          type: "string"
          description: "Handler instance identifier."
        "type":
          type: "string"
          description: "Instrument category (e.g., 'card', 'tokenized_card')."
        "billing_address": {"$ref": "#/components/schemas/PostalAddress", "description": "Billing address."}
        "credential": {"$ref": "#/components/schemas/PaymentCredential"}
        "display":
          type: "object"
          description: "Display information for the instrument."
    "SelectedPaymentInstrument":
      description: "A payment instrument with selection state."
      allOf:
        - {"$ref": "#/components/schemas/PaymentInstrument"}
        - type: "object"
          properties:
            "selected":
              type: "boolean"
              description: "Whether this instrument is selected by the user."
    "Payment":
      type: "object"
      description: "Payment configuration containing instruments."
      properties:
        "instruments":
          type: "array"
          items: {"$ref": "#/components/schemas/SelectedPaymentInstrument"}
          description: "Payment instruments available. Each instrument is associated with a handler via handler_id."
    "DeliveryEvent":
      type: "object"
      description: "A single delivery event definition."
      required:
        - "description"
      additionalProperties: false
      properties:
        "description":
          type: "string"
          description: "Human-readable description of the event."
    "DeliveryEventVocabulary":
      type: "object"
      description: "Schema for delivery event vocabularies."
      required:
        - "name"
        - "version"
        - "title"
        - "events"
      additionalProperties: false
      properties:
        "name":
          type: "string"
          pattern: "^[a-z][a-z0-9-]*(\\.[a-z][a-z0-9-]*)+$"
          description: "Standard identifier in reverse-domain notation."
        "version":
          type: "string"
          pattern: "^\\d{4}-\\d{2}-\\d{2}$"
          description: "Version in YYYY-MM-DD format."
        "extends":
          type: "array"
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            type: "string"
            pattern: "^[a-z][a-z0-9-]*(\\.[a-z][a-z0-9-]*)+@\\d{4}-\\d{2}-\\d{2}$"
          description: "Parent standard this extends (optional, max one)."
        "title":
          type: "string"
          description: "Human-readable title."
        "description":
          type: "string"
          description: "Human-readable description."
        "spec":
          type: "string"
          format: "uri"
          description: "URL to specification document."
        "events":
          type: "object"
          minProperties: 1
          additionalProperties: {"$ref": "#/components/schemas/DeliveryEvent"}
          description: "Map of event IDs to event definitions."
