[project]
name = "local-protocol-sdk"
version = "0.1.0"
description = "Python SDK for Local Protocol - generated from JSON schemas"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Local Protocol Team" }
]
dependencies = [
    "pydantic>=2.0.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator[http]>=0.50.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_protocol_sdk"]

[tool.ruff]
line-length = 80
indent-width = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "SIM", "N", "UP", "D", "PTH"]
ignore = ["D203", "D213"]
